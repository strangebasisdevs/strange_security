name: Trivy image

on:
  workflow_call:
    inputs:
      upload-sarif:
        description: >-
          Upload the SARIF reports to GitHub code scanning. Set false for a
          private repository without code scanning. The caller still grants
          security-events write, which the permissions cap below requires.
        required: false
        default: true
        type: boolean
      timeout-minutes:
        description: >-
          Timeout for the scan job, a whole number of minutes from 1 to 360.
        required: false
        default: 30
        type: number
      image:
        description: Image reference without tag or digest, e.g. ghcr.io/strangebasisdevs/strange_ringtone
        required: true
        type: string
      digest:
        description: Manifest digest to scan, e.g. sha256:0123...
        required: true
        type: string
      registry-login:
        description: >-
          Log in to ghcr.io with the registry-token secret before pulling, for
          private images. The job fails if this is true and the secret is
          empty. GITHUB_TOKEN is not used: the permissions cap has no packages
          read. Leave false for public images, which need no login.
        required: false
        default: false
        type: boolean
    secrets:
      registry-token:
        description: >-
          Read-only package token for ghcr.io (a personal access token (classic) with
          read:packages; GitHub Packages only supports classic tokens). Only used when registry-login is true. Not GITHUB_TOKEN.
        required: false

# Declared cap. A called workflow can only keep or reduce the token the caller
# grants, and it cannot make a permission depend on an input, so this cap is
# fixed: callers grant contents: read, actions: read and security-events: write,
# also with upload-sarif: false. packages is deliberately absent: GITHUB_TOKEN
# never reads private GHCR packages here, the registry-token secret does.
permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  trivy-image:
    name: Trivy image scan
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}

    steps:
      # Fails before any checkout or scan on a timeout the job cannot honour.
      - name: Validate timeout
        env:
          TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
        run: |
          if [[ ! "$TIMEOUT_MINUTES" =~ ^[1-9][0-9]{0,2}$ ]] || (( TIMEOUT_MINUTES > 360 )); then
            echo "::error::timeout-minutes must be a whole number from 1 to 360"
            exit 1
          fi

      # Scan exactly image@digest, never a tag, so the caller can push
      # untagged, scan, and tag only on pass.
      - name: Validate image reference
        id: ref
        env:
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ inputs.digest }}
        # Whole-string matches, not grep: grep passes if any one line matches,
        # so a multiline input could append its own reference= output line.
        run: |
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::digest must be sha256: followed by 64 lowercase hex characters"
            exit 1
          fi
          # A colon after the last slash is a tag; an @ is a digest.
          if [[ ! "$IMAGE" =~ ^[a-z0-9][a-z0-9._/:-]*$ ]] || [[ "${IMAGE##*/}" == *:* ]]; then
            echo "::error::image must be a reference without tag or digest"
            exit 1
          fi
          echo "reference=$IMAGE@$DIGEST" >> "$GITHUB_OUTPUT"

      # Checked out for the caller's .trivyignore and trivy.yaml, and so the
      # SARIF upload has the caller's source to link results to.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # In a called workflow the github context belongs to the caller, so
      # github.workflow_ref names the caller's workflow. job.workflow_repository
      # and job.workflow_sha name this file's own repository and commit. Fail
      # if they are empty: actions/checkout would silently fall back to the caller.
      - name: Resolve shared workflow source
        id: shared
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -z "$WORKFLOW_REPOSITORY" ] || [ -z "$WORKFLOW_SHA" ]; then
            echo "::error::job.workflow_repository or job.workflow_sha is empty"
            exit 1
          fi
          echo "repository=$WORKFLOW_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "sha=$WORKFLOW_SHA" >> "$GITHUB_OUTPUT"

      # actions/checkout follows a symlink at its target path and empties an existing
      # directory that has no .git before cloning into it. A caller that committed a
      # .strange-security file, directory or symlink (even a dangling one) could so
      # make the shared checkout wipe and replace one of its own directories, which
      # the scans then skip as "the shared checkout". Refuse any such path, before
      # the shared checkout, so .strange-security only ever holds that checkout.
      - name: Refuse caller-planted .strange-security path
        run: |
          if [ -e .strange-security ] || [ -L .strange-security ]; then
            echo "::error::The caller repository must not contain a .strange-security path (file, directory or symlink): the shared workflow source is checked out there and that path is excluded from the scans"
            exit 1
          fi
          # The same rule at any depth: find does not follow symlinks, prunes only the
          # top-level ./.git, and -name matches directories, files and symlinks (also
          # dangling ones). If find fails (unreadable directory, ...) the step fails too.
          list=$(mktemp) || { echo "::error::Could not create a temporary file to search the workspace for .strange-security paths"; exit 1; }
          trap 'rm -f "$list"' EXIT
          if ! find . -path ./.git -prune -o -name .strange-security -print0 >"$list"; then
            echo "::error::Could not search the whole workspace for .strange-security paths, so none can be ruled out"
            exit 1
          fi
          if [ -s "$list" ]; then
            found=$(head -z -n 20 "$list" | tr '\0' ' ' | tr -c 'A-Za-z0-9._/ -' '?')
            echo "::error::The caller repository must not contain a .strange-security path (file, directory or symlink) at any depth: the shared workflow source is checked out there and that path is excluded from the scans, found (first 20): $found"
            exit 1
          fi

      # The Dockerfile lives in this workflow's repository, so check it out at
      # the exact commit this workflow file came from.
      - name: Checkout shared workflow repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.shared.outputs.repository }}
          ref: ${{ steps.shared.outputs.sha }}
          path: .strange-security
          persist-credentials: false

      - name: Verify shared workflow checkout
        env:
          WORKFLOW_SHA: ${{ steps.shared.outputs.sha }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          # A real directory at exactly <workspace>/.strange-security, the root of
          # its own git repository: not a symlink, not reached through one, and
          # not a subdirectory of another repository such as the caller's.
          [ ! -L .strange-security ] || fail ".strange-security must not be a symlink"
          workspace="$(pwd -P)" || fail "cannot resolve the workspace"
          location="$(cd .strange-security && pwd -P)" || fail ".strange-security is not a directory"
          [ "$location" = "$workspace/.strange-security" ] || fail ".strange-security does not resolve to the workspace's own .strange-security directory"
          toplevel="$(git -C .strange-security rev-parse --show-toplevel)" || fail ".strange-security is not a git checkout"
          toplevel="$(cd "$toplevel" && pwd -P)" || fail "cannot resolve the git top level of .strange-security"
          [ "$toplevel" = "$location" ] || fail ".strange-security is not the root of its own git repository"
          [ "$(git -C .strange-security rev-parse HEAD)" = "$WORKFLOW_SHA" ] || fail ".strange-security is not at the workflow commit"
          test -d .strange-security/scanner-images

      # Image version lives in scanner-images/trivy.Dockerfile, the single spot Dependabot updates.
      - name: Build Trivy image
        run: |
          docker build \
            --file .strange-security/scanner-images/trivy.Dockerfile \
            --tag trivy-scanner \
            .strange-security

      # A hosted ubuntu-24.04 runner has a single 145 GB root disk (2026-10-29: 59 GB
      # used before this step), and Trivy's --image-src docker exports a full
      # uncompressed copy of the image on top of the daemon's own copy. On
      # 2026-10-29 the secret scan of ghcr.io/open-webui/open-webui and
      # ollama/ollama died with "write /tmp/trivy-.../docker-export-...: no space
      # left on device" at 26 MB free.
      # Removes the preinstalled toolchains this job never uses, literal paths
      # only: nothing here is built from an input, a variable or a glob, and a
      # path that is absent is skipped, so a rerun or another image is harmless.
      # No docker prune: the scanner image built just before this step must stay.
      # Hosted runners are single-use VMs, so the removal runs only there
      # (RUNNER_ENVIRONMENT); a self-hosted runner keeps its toolchains.
      - name: Free runner disk
        run: |
          echo "Disk before:"
          df -h / "$RUNNER_TEMP" || true
          if [ "${RUNNER_ENVIRONMENT:-}" = github-hosted ]; then
            if [ -d /usr/share/dotnet ]; then sudo rm -rf /usr/share/dotnet; fi
            if [ -d /usr/local/lib/android ]; then sudo rm -rf /usr/local/lib/android; fi
            if [ -d /opt/ghc ]; then sudo rm -rf /opt/ghc; fi
            if [ -d /usr/local/.ghcup ]; then sudo rm -rf /usr/local/.ghcup; fi
            if [ -d /opt/hostedtoolcache/CodeQL ]; then sudo rm -rf /opt/hostedtoolcache/CodeQL; fi
            if [ -d /usr/share/swift ]; then sudo rm -rf /usr/share/swift; fi
            if [ -d /usr/local/share/powershell ]; then sudo rm -rf /usr/local/share/powershell; fi
            if [ -d /usr/local/share/chromium ]; then sudo rm -rf /usr/local/share/chromium; fi
          else
            echo "::notice::Not a GitHub-hosted runner: leaving the host's toolchains alone"
          fi
          echo "Disk after:"
          df -h / "$RUNNER_TEMP" || true

      # Optional, for private images only. Uses the docker CLI rather than a
      # third-party action. The token reaches docker through stdin from an
      # environment variable, never a command-line argument, and is referenced
      # only in this step, so with registry-login off it is never evaluated.
      # It is the caller's registry-token secret, not GITHUB_TOKEN (the
      # permissions cap above has no packages permission, so GITHUB_TOKEN can
      # never read a private package here), and an empty one is an error
      # rather than an anonymous login.
      - name: Log in to GitHub Container Registry
        if: ${{ inputs.registry-login }}
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.registry-token }}
        run: |
          if [ -z "$REGISTRY_TOKEN" ]; then
            echo "::error::registry-login is true but the registry-token secret is empty; pass a read-only package token as registry-token"
            exit 1
          fi
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin

      # Pulled by the runner's Docker daemon, which holds any login, and handed
      # to Trivy through the socket so Trivy never sees the credentials.
      - name: Pull image
        id: pull
        env:
          REFERENCE: ${{ steps.ref.outputs.reference }}
        run: docker pull "$REFERENCE"

      # Trivy's docker export goes to TMPDIR inside the scanner container, which is
      # bound to a directory under RUNNER_TEMP so the export is not written into
      # the container's overlay. The root disk is the only disk on a hosted
      # ubuntu-24.04 runner (2026-10-29 run: 145 GB, 59 GB used before the step,
      # 32 GB after), so the removals above are what makes room. The pinned scanner
      # image runs as root, so the host path's owner does not matter.
      - name: Prepare scan scratch directory
        id: scratch
        run: |
          scratch="$RUNNER_TEMP/trivy-images/tmp"
          mkdir -p "$scratch"
          echo "scratch=$scratch" >> "$GITHUB_OUTPUT"

      # Unfiltered by severity: --severity also filters the secret scanner,
      # and some built-in secret rules are below HIGH. Any secret fails.
      - name: Run Trivy secret scan
        env:
          REFERENCE: ${{ steps.ref.outputs.reference }}
          SCRATCH: ${{ steps.scratch.outputs.scratch }}
        run: |
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$PWD:/src" \
            --volume "$SCRATCH:/scratch" \
            --env TMPDIR=/scratch \
            --workdir /src \
            trivy-scanner \
            image --image-src docker --scanners secret \
            --format sarif --output /src/trivy-image-secret.sarif --exit-code 1 \
            "$REFERENCE"

      # Runs even when the secret scan failed, so both reports are uploaded.
      - name: Run Trivy vulnerability scan
        if: ${{ !cancelled() && steps.pull.outcome == 'success' }}
        env:
          REFERENCE: ${{ steps.ref.outputs.reference }}
          SCRATCH: ${{ steps.scratch.outputs.scratch }}
        run: |
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$PWD:/src" \
            --volume "$SCRATCH:/scratch" \
            --env TMPDIR=/scratch \
            --workdir /src \
            trivy-scanner \
            image --image-src docker --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --format sarif --output /src/trivy-image-vuln.sarif --exit-code 1 \
            "$REFERENCE"

      # Categories carry the image name, so a caller that scans several images
      # keeps one code scanning run per image instead of overwriting them.
      - name: Upload secret scan SARIF
        if: ${{ always() && inputs.upload-sarif }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy-image-secret.sarif
          category: trivy-image-secret/${{ inputs.image }}

      - name: Upload vulnerability scan SARIF
        if: ${{ always() && inputs.upload-sarif }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy-image-vuln.sarif
          category: trivy-image/${{ inputs.image }}
