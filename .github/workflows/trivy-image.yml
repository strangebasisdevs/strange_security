name: Trivy image

on:
  workflow_call:
    inputs:
      image:
        description: Image reference without tag or digest, e.g. ghcr.io/strangebasisdevs/strange_ringtone
        required: true
        type: string
      digest:
        description: Manifest digest to scan, e.g. sha256:0123...
        required: true
        type: string
      registry-login:
        description: >-
          Log in to ghcr.io as github.actor with the caller's GITHUB_TOKEN
          before pulling, for private images. The caller must then grant
          packages read. Leave false for public images.
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  packages: read
  security-events: write

jobs:
  trivy-image:
    name: Trivy image scan
    runs-on: ubuntu-24.04

    steps:
      # Scan exactly image@digest, never a tag, so the caller can push
      # untagged, scan, and tag only on pass.
      - name: Validate image reference
        id: ref
        env:
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ inputs.digest }}
        # Whole-string matches, not grep: grep passes if any one line matches,
        # so a multiline input could append its own reference= output line.
        run: |
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::digest must be sha256: followed by 64 lowercase hex characters"
            exit 1
          fi
          # A colon after the last slash is a tag; an @ is a digest.
          if [[ ! "$IMAGE" =~ ^[a-z0-9][a-z0-9._/:-]*$ ]] || [[ "${IMAGE##*/}" == *:* ]]; then
            echo "::error::image must be a reference without tag or digest"
            exit 1
          fi
          echo "reference=$IMAGE@$DIGEST" >> "$GITHUB_OUTPUT"

      # Checked out for the caller's .trivyignore and trivy.yaml, and so the
      # SARIF upload has the caller's source to link results to.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # In a called workflow the github context belongs to the caller, so
      # github.workflow_ref names the caller's workflow. job.workflow_repository
      # and job.workflow_sha name this file's own repository and commit. Fail
      # if they are empty: actions/checkout would silently fall back to the caller.
      - name: Resolve shared workflow source
        id: shared
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -z "$WORKFLOW_REPOSITORY" ] || [ -z "$WORKFLOW_SHA" ]; then
            echo "::error::job.workflow_repository or job.workflow_sha is empty"
            exit 1
          fi
          echo "repository=$WORKFLOW_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "sha=$WORKFLOW_SHA" >> "$GITHUB_OUTPUT"

      # The Dockerfile lives in this workflow's repository, so check it out at
      # the exact commit this workflow file came from.
      - name: Checkout shared workflow repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.shared.outputs.repository }}
          ref: ${{ steps.shared.outputs.sha }}
          path: .strange-security
          persist-credentials: false

      - name: Verify shared workflow checkout
        env:
          WORKFLOW_SHA: ${{ steps.shared.outputs.sha }}
        run: |
          test "$(git -C .strange-security rev-parse HEAD)" = "$WORKFLOW_SHA"
          test -d .strange-security/scanner-images

      # Image version lives in scanner-images/trivy.Dockerfile, the single spot Dependabot updates.
      - name: Build Trivy image
        run: |
          docker build \
            --file .strange-security/scanner-images/trivy.Dockerfile \
            --tag trivy-scanner \
            .strange-security

      # Optional, for private images only. Uses the docker CLI rather than a
      # third-party action. The token reaches docker through stdin from an
      # environment variable, never a command-line argument.
      - name: Log in to GitHub Container Registry
        if: ${{ inputs.registry-login }}
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin

      # Pulled by the runner's Docker daemon, which holds any login, and handed
      # to Trivy through the socket so Trivy never sees the credentials.
      - name: Pull image
        id: pull
        env:
          REFERENCE: ${{ steps.ref.outputs.reference }}
        run: docker pull "$REFERENCE"

      # Unfiltered by severity: --severity also filters the secret scanner,
      # and some built-in secret rules are below HIGH. Any secret fails.
      - name: Run Trivy secret scan
        env:
          REFERENCE: ${{ steps.ref.outputs.reference }}
        run: |
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$PWD:/src" \
            --workdir /src \
            trivy-scanner \
            image --image-src docker --scanners secret \
            --format sarif --output /src/trivy-image-secret.sarif --exit-code 1 \
            "$REFERENCE"

      # Runs even when the secret scan failed, so both reports are uploaded.
      - name: Run Trivy vulnerability scan
        if: ${{ !cancelled() && steps.pull.outcome == 'success' }}
        env:
          REFERENCE: ${{ steps.ref.outputs.reference }}
        run: |
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$PWD:/src" \
            --workdir /src \
            trivy-scanner \
            image --image-src docker --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --format sarif --output /src/trivy-image-vuln.sarif --exit-code 1 \
            "$REFERENCE"

      # Categories carry the image name, so a caller that scans several images
      # keeps one code scanning run per image instead of overwriting them.
      - name: Upload secret scan SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy-image-secret.sarif
          category: trivy-image-secret/${{ inputs.image }}

      - name: Upload vulnerability scan SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy-image-vuln.sarif
          category: trivy-image/${{ inputs.image }}
