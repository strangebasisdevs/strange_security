name: Semgrep

on:
  workflow_call:
    inputs:
      upload-sarif:
        description: >-
          Upload the SARIF reports to GitHub code scanning. Set false for a
          private repository without code scanning. The caller still grants
          security-events write, which the permissions cap below requires.
        required: false
        default: true
        type: boolean
      timeout-minutes:
        description: >-
          Timeout for the scan job, a whole number of minutes from 1 to 360.
        required: false
        default: 30
        type: number

# Declared cap. A called workflow can only keep or reduce the token the caller
# grants, and it cannot make a permission depend on an input, so this cap is
# fixed: callers grant contents: read, actions: read and security-events: write,
# also with upload-sarif: false. packages is deliberately absent, so
# GITHUB_TOKEN cannot read private GHCR packages.
permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  semgrep:
    name: Semgrep scan
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}

    steps:
      # Fails before any checkout or scan on a timeout the job cannot honour.
      - name: Validate timeout
        env:
          TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
        run: |
          if [[ ! "$TIMEOUT_MINUTES" =~ ^[1-9][0-9]{0,2}$ ]] || (( TIMEOUT_MINUTES > 360 )); then
            echo "::error::timeout-minutes must be a whole number from 1 to 360"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # In a called workflow the github context belongs to the caller, so
      # github.workflow_ref names the caller's workflow. job.workflow_repository
      # and job.workflow_sha name this file's own repository and commit. Fail
      # if they are empty: actions/checkout would silently fall back to the caller.
      - name: Resolve shared workflow source
        id: shared
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -z "$WORKFLOW_REPOSITORY" ] || [ -z "$WORKFLOW_SHA" ]; then
            echo "::error::job.workflow_repository or job.workflow_sha is empty"
            exit 1
          fi
          echo "repository=$WORKFLOW_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "sha=$WORKFLOW_SHA" >> "$GITHUB_OUTPUT"

      # actions/checkout follows a symlink at its target path and empties an existing
      # directory that has no .git before cloning into it. A caller that committed a
      # .strange-security file, directory or symlink (even a dangling one) could so
      # make the shared checkout wipe and replace one of its own directories, which
      # the scans then skip as "the shared checkout". Refuse any such path, before
      # the shared checkout, so .strange-security only ever holds that checkout.
      - name: Refuse caller-planted .strange-security path
        run: |
          if [ -e .strange-security ] || [ -L .strange-security ]; then
            echo "::error::The caller repository must not contain a .strange-security path (file, directory or symlink): the shared workflow source is checked out there and that path is excluded from the scans"
            exit 1
          fi
          # The same rule at any depth: find does not follow symlinks, prunes only the
          # top-level ./.git, and -name matches directories, files and symlinks (also
          # dangling ones). If find fails (unreadable directory, ...) the step fails too.
          list=$(mktemp) || { echo "::error::Could not create a temporary file to search the workspace for .strange-security paths"; exit 1; }
          trap 'rm -f "$list"' EXIT
          if ! find . -path ./.git -prune -o -name .strange-security -print0 >"$list"; then
            echo "::error::Could not search the whole workspace for .strange-security paths, so none can be ruled out"
            exit 1
          fi
          if [ -s "$list" ]; then
            found=$(head -z -n 20 "$list" | tr '\0' ' ' | tr -c 'A-Za-z0-9._/ -' '?')
            echo "::error::The caller repository must not contain a .strange-security path (file, directory or symlink) at any depth: the shared workflow source is checked out there and that path is excluded from the scans, found (first 20): $found"
            exit 1
          fi

      # The Dockerfile lives in this workflow's repository, so check it out at
      # the exact commit this workflow file came from.
      - name: Checkout shared workflow repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.shared.outputs.repository }}
          ref: ${{ steps.shared.outputs.sha }}
          path: .strange-security
          persist-credentials: false

      # The report and checker steps below run under always(), so after a failed
      # scan too. They run code from this checkout only if this step succeeded in
      # this run (steps.shared_verified.outcome == 'success'): the checkout is the
      # exact commit this workflow file came from and holds the scripts. Resolving,
      # checking out or verifying stays gating: if it fails the job fails.
      - name: Verify shared workflow checkout
        id: shared_verified
        env:
          WORKFLOW_SHA: ${{ steps.shared.outputs.sha }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          # A real directory at exactly <workspace>/.strange-security, the root of
          # its own git repository: not a symlink, not reached through one, and
          # not a subdirectory of another repository such as the caller's.
          [ ! -L .strange-security ] || fail ".strange-security must not be a symlink"
          workspace="$(pwd -P)" || fail "cannot resolve the workspace"
          location="$(cd .strange-security && pwd -P)" || fail ".strange-security is not a directory"
          [ "$location" = "$workspace/.strange-security" ] || fail ".strange-security does not resolve to the workspace's own .strange-security directory"
          toplevel="$(git -C .strange-security rev-parse --show-toplevel)" || fail ".strange-security is not a git checkout"
          toplevel="$(cd "$toplevel" && pwd -P)" || fail "cannot resolve the git top level of .strange-security"
          [ "$toplevel" = "$location" ] || fail ".strange-security is not the root of its own git repository"
          [ "$(git -C .strange-security rev-parse HEAD)" = "$WORKFLOW_SHA" ] || fail ".strange-security is not at the workflow commit"
          test -d .strange-security/scanner-images
          test -f .strange-security/scripts/sarif_report.py
          test -f .strange-security/scripts/check_suppressions.py

      # Image version lives in scanner-images/semgrep.Dockerfile, the single spot Dependabot updates.
      - name: Build Semgrep image
        run: |
          docker build \
            --file .strange-security/scanner-images/semgrep.Dockerfile \
            --tag semgrep-scanner \
            .strange-security

      # The SARIF goes to a dedicated directory under the runner's temp
      # directory (the only writable mount), outside the caller's tree,
      # so the suppression check below sees only the caller's files (SARIF holds
      # source snippets that contain suppression comments).
      # --error exits non-zero on any finding, so findings fail the job; the
      # upload below still runs and records them in code scanning.
      - name: Run Semgrep
        run: |
          mkdir -p "$RUNNER_TEMP/semgrep"
          docker run --rm \
            --volume "$PWD:/src:ro" \
            --volume "$RUNNER_TEMP/semgrep:/out" \
            --workdir /src \
            semgrep-scanner \
            semgrep scan --config p/default --exclude .strange-security \
            --error --sarif --output /out/semgrep.sarif /src

      - name: Upload SARIF results
        if: ${{ always() && inputs.upload-sarif }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: ${{ runner.temp }}/semgrep/semgrep.sarif
          category: semgrep

      # Findings in the step summary and as annotations, from the SARIF above,
      # whether or not it is uploaded. No code snippets are shown. Always, so it
      # runs after a failed scan; it exits 0 whatever happens, so it never
      # changes the job result (only the scan decides).
      - name: Report Semgrep findings
        if: always() && steps.shared_verified.outcome == 'success'
        run: |
          python3 -I .strange-security/scripts/sarif_report.py --tool semgrep \
            --sarif "$RUNNER_TEMP/semgrep/semgrep.sarif" \
            || echo "::warning::The Semgrep findings report could not run"

      # Policy check on the caller's code (docs/SUPPRESSIONS.md), run from the
      # shared checkout with -I so the caller cannot influence the interpreter.
      # The shared checkout itself is not scanned. Last, with always(), so a
      # failing check cannot skip the scan or the upload, and a failing scan
      # or upload cannot skip the check; any one failing fails the job. Only from
      # a verified shared checkout: if that failed the job has already failed, and
      # the check is skipped rather than run from an unauthenticated script.
      - name: Check Semgrep suppressions
        if: always() && steps.shared_verified.outcome == 'success'
        run: python3 -I .strange-security/scripts/check_suppressions.py .
