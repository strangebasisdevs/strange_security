name: Semgrep

on:
  workflow_call:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  semgrep:
    name: Semgrep scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve shared workflow source
        id: shared
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          echo "repository=${WORKFLOW_REF%%/.github/*}" >> "$GITHUB_OUTPUT"
          echo "ref=${WORKFLOW_REF##*@}" >> "$GITHUB_OUTPUT"

      # The Dockerfile lives in this workflow's repository, so check it out at the
      # ref the caller referenced instead of relying on the caller's checkout.
      - name: Checkout shared workflow repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.shared.outputs.repository }}
          ref: ${{ steps.shared.outputs.ref }}
          path: .strange-security
          persist-credentials: false

      # Image version lives in .github/docker/semgrep.Dockerfile, the single spot Dependabot updates.
      - name: Build Semgrep image
        run: |
          docker build \
            --file .strange-security/.github/docker/semgrep.Dockerfile \
            --tag semgrep-scanner \
            .strange-security

      - name: Run Semgrep
        run: |
          docker run --rm \
            --volume "$PWD:/src" \
            --workdir /src \
            semgrep-scanner \
            semgrep scan --config p/default --exclude .strange-security \
            --sarif --output /src/semgrep.sarif /src

      - name: Upload SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: semgrep.sarif
          category: semgrep