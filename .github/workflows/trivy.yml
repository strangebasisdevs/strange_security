name: Trivy

on:
  workflow_call:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  trivy:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    # Run the job inside the Trivy image itself rather than shelling out to
    # `docker run` on the runner (mirrors Semgrep's recommended container job pattern).
    container:
      image: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Trivy
        shell: sh
        run: |
          trivy fs --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed \
            --format sarif --output trivy-results.sarif --exit-code 1 .

      - name: Upload SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-results.sarif
          category: trivy