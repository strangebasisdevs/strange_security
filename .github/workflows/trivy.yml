name: Trivy

on:
  workflow_call:
    inputs:
      upload-sarif:
        description: >-
          Upload the SARIF reports to GitHub code scanning. Set false for a
          private repository without code scanning. The caller still grants
          security-events write, which the permissions cap below requires.
        required: false
        default: true
        type: boolean
      timeout-minutes:
        description: >-
          Timeout for the scan job, a whole number of minutes from 1 to 360.
        required: false
        default: 30
        type: number

# Declared cap. A called workflow can only keep or reduce the token the caller
# grants, and it cannot make a permission depend on an input, so this cap is
# fixed: callers grant contents: read, actions: read and security-events: write,
# also with upload-sarif: false. packages is deliberately absent, so
# GITHUB_TOKEN cannot read private GHCR packages.
permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  trivy:
    name: Trivy filesystem scan
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}

    steps:
      # Fails before any checkout or scan on a timeout the job cannot honour.
      - name: Validate timeout
        env:
          TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
        run: |
          if [[ ! "$TIMEOUT_MINUTES" =~ ^[1-9][0-9]{0,2}$ ]] || (( TIMEOUT_MINUTES > 360 )); then
            echo "::error::timeout-minutes must be a whole number from 1 to 360"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # In a called workflow the github context belongs to the caller, so
      # github.workflow_ref names the caller's workflow. job.workflow_repository
      # and job.workflow_sha name this file's own repository and commit. Fail
      # if they are empty: actions/checkout would silently fall back to the caller.
      - name: Resolve shared workflow source
        id: shared
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -z "$WORKFLOW_REPOSITORY" ] || [ -z "$WORKFLOW_SHA" ]; then
            echo "::error::job.workflow_repository or job.workflow_sha is empty"
            exit 1
          fi
          echo "repository=$WORKFLOW_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "sha=$WORKFLOW_SHA" >> "$GITHUB_OUTPUT"

      # The Dockerfile lives in this workflow's repository, so check it out at
      # the exact commit this workflow file came from.
      - name: Checkout shared workflow repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.shared.outputs.repository }}
          ref: ${{ steps.shared.outputs.sha }}
          path: .strange-security
          persist-credentials: false

      # The report steps below run under always(), so after a failed
      # scan too. They run code from this checkout only if this step succeeded in
      # this run (steps.shared_verified.outcome == 'success'): the checkout is the
      # exact commit this workflow file came from and holds the scripts. Resolving,
      # checking out or verifying stays gating: if it fails the job fails.
      - name: Verify shared workflow checkout
        id: shared_verified
        env:
          WORKFLOW_SHA: ${{ steps.shared.outputs.sha }}
        run: |
          test "$(git -C .strange-security rev-parse HEAD)" = "$WORKFLOW_SHA"
          test -d .strange-security/scanner-images
          test -f .strange-security/scripts/sarif_report.py

      # Image version lives in scanner-images/trivy.Dockerfile, the single spot Dependabot updates.
      - name: Build Trivy image
        id: build
        run: |
          docker build \
            --file .strange-security/scanner-images/trivy.Dockerfile \
            --tag trivy-scanner \
            .strange-security

      # Unfiltered by severity: --severity also filters the secret scanner,
      # and some built-in secret rules are below HIGH. Any secret fails.
      - name: Run Trivy secret scan
        run: |
          docker run --rm \
            --volume "$PWD:/src" \
            --workdir /src \
            trivy-scanner \
            fs --scanners secret \
            --skip-dirs .strange-security \
            --format sarif --output /src/trivy-secret.sarif --exit-code 1 /src

      # Runs even when the secret scan failed, so both reports are uploaded.
      - name: Run Trivy vulnerability scan
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          docker run --rm \
            --volume "$PWD:/src" \
            --workdir /src \
            trivy-scanner \
            fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --skip-dirs .strange-security \
            --format sarif --output /src/trivy-vuln.sarif --exit-code 1 /src

      # Findings of both scans in the step summary and as annotations, from the
      # SARIF files the scans wrote, whether or not they are uploaded. Redacted:
      # no secret text, only rule, file and line for secrets. Always, so it runs
      # after a failed scan; it exits 0 whatever happens, so it never changes the
      # job result (only the scan steps decide). python3 -I, from the shared checkout,
      # and only once that checkout was verified (see Verify shared workflow checkout).
      #
      # One report step per scan: GitHub shows 10 error annotations per step, so
      # each scan gets its own 10.
      - name: Report Trivy secret findings
        if: always() && steps.shared_verified.outcome == 'success'
        run: |
          python3 -I .strange-security/scripts/sarif_report.py --tool trivy-secret --sarif trivy-secret.sarif \
            || echo "::warning::The Trivy secret findings report could not run"

      - name: Report Trivy vulnerability findings
        if: always() && steps.shared_verified.outcome == 'success'
        run: |
          python3 -I .strange-security/scripts/sarif_report.py --tool trivy-vuln --sarif trivy-vuln.sarif \
            || echo "::warning::The Trivy vulnerability findings report could not run"

      # Code scanning takes one SARIF run per category. Vulnerabilities keep
      # the existing trivy category; secrets get their own.
      - name: Upload secret scan SARIF
        if: ${{ always() && inputs.upload-sarif }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy-secret.sarif
          category: trivy-secret

      - name: Upload vulnerability scan SARIF
        if: ${{ always() && inputs.upload-sarif }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy-vuln.sarif
          category: trivy