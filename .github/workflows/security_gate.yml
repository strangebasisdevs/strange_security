name: Security gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  # The jobs below call the shared workflows locally, where the caller and the
  # called workflow share one repository, so a workflow that locates itself
  # through the caller's github context still passes here and only breaks for
  # other repositories. This job fails on that pattern instead.
  contract:
    name: Reusable workflow contract
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check how shared workflows locate themselves
        run: |
          status=0
          for file in .github/workflows/*.yml; do
            grep -qE '^([^A-Za-z_ #:]?on[^A-Za-z_ #:]?:[^#]*[^A-Za-z_]workflow_call([^A-Za-z_]|$)|[ ]+workflow_call:)' "$file" || continue
            if grep -nE '^[^#]*github\.(workflow_ref|workflow_sha|job_workflow_sha)' "$file"; then
              echo "::error file=$file::uses the caller's github.workflow_* context; use job.workflow_repository and job.workflow_sha"
              status=1
            fi
            # Each reusable workflow declares a permissions cap: exactly actions: read
            # and contents: read, plus security-events: write when it uploads SARIF.
            # No packages, no other read or write, and no second block in a job.
            if [ "$(grep -cE '^[[:space:]]*["'"'"']?permissions["'"'"']?[[:space:]]*:' "$file")" != 1 ]; then
              echo "::error file=$file::must declare exactly one top-level permissions block and no job-level one"
              status=1
            fi
            # Take the whole top-level block (every line indented under it, skipping only
            # blank and full-line comment lines), normalise each entry (quotes around
            # key and value, trailing comment, whitespace) and mark what does not parse
            # as key: value, so flow-style or scalar permissions and any odd entry fail
            # the comparison below. A duplicate key stays twice in the list and fails too.
            declared=$(tr -d '\r' < "$file" | awk '
              BEGIN {
                id = "[A-Za-z-]+"
                tok = "(\042" id "\042|\047" id "\047|" id ")"
              }
              /^[\042\047]?permissions[\042\047]?[ \t]*:/ {
                f = 1; r = $0
                sub(/^[\042\047]?permissions[\042\047]?[ \t]*:/, "", r); sub(/^[ \t]+/, "", r)
                sub(/^#.*/, "", r); sub(/[ \t]+#.*$/, "", r); sub(/[ \t]+$/, "", r)
                if (r != "") print "INLINE " r
                next
              }
              f {
                if ($0 ~ /^[ \t]*$/ || $0 ~ /^[ \t]*#/) next
                if ($0 ~ /^[^ \t]/) { f = 0; next }
                l = $0
                sub(/^[ \t]+/, "", l); sub(/[ \t]+#.*$/, "", l); sub(/[ \t]+$/, "", l)
                if (l ~ ("^" tok "[ \t]*:[ \t]+" tok "$")) {
                  i = index(l, ":")
                  k = substr(l, 1, i - 1); v = substr(l, i + 1)
                  gsub(/[ \t\042\047]/, "", k); gsub(/[ \t\042\047]/, "", v)
                  print k ": " v
                } else {
                  print "INVALID " l
                }
              }' | sort | tr '\n' ',')
            expected='actions: read,contents: read,'
            if grep -q 'upload-sarif@' "$file"; then
              expected="${expected}security-events: write,"
            fi
            if [ "$declared" != "$expected" ]; then
              echo "::error file=$file::permissions cap is '$declared', expected '$expected'"
              status=1
            fi
            if grep -q '\.strange-security' "$file"; then
              for key in 'job.workflow_repository' 'job.workflow_sha'; do
                # No literal dollar-brace-brace here: Actions would parse it as an expression.
                if ! grep -qF "{{ $key }}" "$file"; then
                  echo "::error file=$file::checks out .strange-security without $key"
                  status=1
                fi
              done
            fi
          done
          exit "$status"

  semgrep:
    name: Semgrep
    uses: ./.github/workflows/semgrep.yml

  trivy:
    name: Trivy
    uses: ./.github/workflows/trivy.yml

  gitleaks:
    name: Gitleaks
    uses: ./.github/workflows/gitleaks.yml

  # Exercises trivy-image.yml with a public, digest-pinned image that has no OS
  # packages: Google's distroless static image (Debian 12 based, ca-certs, tzdata
  # and /etc files only). It is deliberately not a scanner or app image, whose
  # CVE status drifts with the Trivy DB and would turn this gate red on a day
  # nothing in this repository changed. Multi-arch index digest of the "latest"
  # tag of gcr.io/distroless/static-debian12, resolved 2026-10-26. Refresh by
  # hand if it ever becomes unpullable; do not point this at trivy.Dockerfile's
  # image, Dependabot owns that file.
  trivy-image:
    name: Trivy image
    #
    # This call also exercises the opt-out inputs below. The called workflow
    # keeps its fixed permissions cap, so this call grants the full cap even
    # though no SARIF is uploaded.
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/trivy-image.yml
    with:
      upload-sarif: false
      timeout-minutes: 20
      image: gcr.io/distroless/static-debian12
      digest: sha256:d75cdd72874d4790092fcb1b058493ecf6bb5bf2b2b897045b00ff01d91843f2

  tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run unit tests
        run: python3 -m unittest discover --start-directory tests --verbose
