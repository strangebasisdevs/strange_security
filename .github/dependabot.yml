version: 2
updates:
  - package-ecosystem: github-actions
    directory: .github/workflows
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - github-actions
    # Delay picking up newly published action versions to reduce exposure to
    # supply-chain attacks (compromised releases are usually caught/yanked quickly).
    cooldown:
      default-days: 7

  # Tracks the semgrep/semgrep and aquasec/trivy pins in scanner-images/*.Dockerfile.
  # Keep this directory outside .github/: for the docker ecosystem Dependabot
  # found the updates under /.github/docker, but create_pull_request returned
  # 400 "invalid or unauthorized changes" (dependency_file_not_supported) on every run.
  - package-ecosystem: docker
    directory: /scanner-images
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - docker
    cooldown:
      default-days: 7
