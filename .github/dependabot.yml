version: 2
updates:
  - package-ecosystem: github-actions
    directory: .github/workflows
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - github-actions
    # Delay picking up newly published action versions to reduce exposure to
    # supply-chain attacks (compromised releases are usually caught/yanked quickly).
    cooldown:
      default-days: 7

# Note: Dependabot's `docker` ecosystem requires an actual Dockerfile/Containerfile
# in the target directory and does not scan `container: image:` references inside
# GitHub Actions workflow files, so the semgrep/semgrep and aquasec/trivy pins in
# .github/workflows/semgrep.yml and trivy.yml must be bumped manually.